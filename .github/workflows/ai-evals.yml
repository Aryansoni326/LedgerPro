name: AI Evals

# Runs on every PR/push that touches RiskEngine, forecast, agents, or the harness.
# Fails the check if precision/recall or grounding rate regress below thresholds.
# Uploads a human-readable markdown report as a workflow artifact.

on:
  pull_request:
    paths:
      - "ledgerpro_backend/intelligence/**"
      - "ledgerpro_backend/agents/**"
      - "ledgerpro_backend/evals/**"
      - ".github/workflows/ai-evals.yml"
  push:
    paths:
      - "ledgerpro_backend/intelligence/**"
      - "ledgerpro_backend/agents/**"
      - "ledgerpro_backend/evals/**"
      - ".github/workflows/ai-evals.yml"

jobs:
  ai-evals:
    name: AI eval harness (precision / recall / grounding)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ledgerpro_backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            ledgerpro_backend/requirements.txt
            ledgerpro_backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run AI evaluation harness
        env:
          USE_SQLITE: "True"
          SECRET_KEY: ci-test-secret-key-not-for-production
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          pytest evals/test_harness_gate.py -v --tb=short

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: |
            ledgerpro_backend/eval-reports/ai-eval-report.md
            ledgerpro_backend/eval-reports/ai-eval-summary.json
          if-no-files-found: warn
