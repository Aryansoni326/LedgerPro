# Render Blueprint — LedgerPro (API + frontend + Postgres + Redis)
# Free plan: no Background Workers — invoice AI runs in-process (CELERY_TASK_ALWAYS_EAGER).
#
# After first deploy, confirm GOOGLE_OAUTH_REDIRECT_URI and NEXT_PUBLIC_API_URL
# match your real *.onrender.com URLs, then redeploy the frontend if needed.

databases:
  - name: ledgerpro-db
    plan: free
    databaseName: ledgerpro
    user: ledgerpro

services:
  - type: keyvalue
    name: ledgerpro-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ledgerpro-api
    runtime: python
    plan: free
    rootDir: ledgerpro_backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerpro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgerpro-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: R2_ACCESS_KEY_ID
        value: "unused"
      - key: R2_SECRET_ACCESS_KEY
        value: "unused"
      - key: R2_BUCKET_NAME
        value: "unused"
      - key: R2_ENDPOINT_URL
        value: "unused"
      # Free plan has no Celery worker — run tasks inside the web request
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

  - type: web
    name: ledgerpro-web
    runtime: node
    plan: free
    rootDir: ledgerpro_frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false
