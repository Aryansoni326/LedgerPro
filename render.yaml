# Render Blueprint — LedgerPro (API + frontend + Celery + Postgres + Redis)
# Dashboard: New → Blueprint → connect Aryansoni326/LedgerPro
#
# After first deploy, set GOOGLE_OAUTH_REDIRECT_URI and NEXT_PUBLIC_API_URL
# to your real *.onrender.com URLs, then redeploy the frontend.

databases:
  - name: ledgerpro-db
    plan: free
    databaseName: ledgerpro
    user: ledgerpro

services:
  - type: keyvalue
    name: ledgerpro-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: ledgerpro-api
    runtime: python
    plan: free
    rootDir: ledgerpro_backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerpro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgerpro-redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Optional — placeholders until Cloudflare R2 is configured
      - key: R2_ACCESS_KEY_ID
        value: "unused"
      - key: R2_SECRET_ACCESS_KEY
        value: "unused"
      - key: R2_BUCKET_NAME
        value: "unused"
      - key: R2_ENDPOINT_URL
        value: "unused"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"

  - type: worker
    name: ledgerpro-celery
    runtime: python
    plan: free
    rootDir: ledgerpro_backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_celery.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: ledgerpro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ledgerpro-redis
          property: connectionString
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: GEMINI_API_KEY
      - key: R2_ACCESS_KEY_ID
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: R2_ACCESS_KEY_ID
      - key: R2_SECRET_ACCESS_KEY
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: R2_SECRET_ACCESS_KEY
      - key: R2_BUCKET_NAME
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: R2_BUCKET_NAME
      - key: R2_ENDPOINT_URL
        fromService:
          type: web
          name: ledgerpro-api
          envVarKey: R2_ENDPOINT_URL

  - type: web
    name: ledgerpro-web
    runtime: node
    plan: free
    rootDir: ledgerpro_frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NEXT_PUBLIC_API_URL
        sync: false
